org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ABIs the Rust library is built for; `-Ppassel.abis=x86_64` speeds up
# emulator-only builds.
passel.abis=arm64-v8a x86_64
# Passel's version, kept in step with the desktop app by release-please.
# x-release-please-start-version
passel.version=0.2.0
# x-release-please-end
