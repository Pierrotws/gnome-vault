[workspace]
members = [".", "crates/passel-core", "crates/passel-ffi"]

[package]
name = "passel"
version = "0.3.1"
edition = "2021"

[dependencies]
passel-core = { path = "crates/passel-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk-markdown = "0.2"
getrandom = "0.4.2"
once_cell = "1.21.4"
log = "0.4.29"
env_logger = "0.11.10"
zeroize = { version = "1.8", features = ["derive"] }
# Google Drive (vaults kept there): the REST API and Google sign-in
# over HTTPS with the system's TLS (OpenSSL, or SChannel on Windows).
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
url = "2.5"
serde_json = "1"
sha2 = "0.11"
data-encoding = "2.8.0"

# The Google sign-in is kept in the system keyring: the Secret Service
# (over D-Bus, in pure Rust: no libdbus) or the Credential Manager.
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

# build.rs: the Windows icon and version details in passel.exe.
[build-dependencies]
embed-resource = "3"
