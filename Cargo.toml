[package]
name = "gnome-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk-markdown = { path = "../gtk-markdown", version = "0.1" }
gpgme = "0.11"
getrandom = "0.4.2"
once_cell = "1.21.4"
git2 = "0.20.4"
log = "0.4.29"
env_logger = "0.11.10"
hmac = "0.12.1"
sha1 = "0.10.6"
data-encoding = "2.8.0"
zeroize = { version = "1.8", features = ["derive"] }

[build-dependencies]
glib-build-tools = "0.22"
