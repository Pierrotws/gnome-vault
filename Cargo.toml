[package]
name = "passel"
version = "0.2.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk-markdown = "0.2"
gpgme = "0.11"
getrandom = "0.4.2"
once_cell = "1.21.4"
git2 = "0.20.4"
log = "0.4.29"
env_logger = "0.11.10"
hmac = "0.12.1"
sha1 = "0.10.6"
data-encoding = "2.8.0"
zeroize = { version = "1.8", features = ["derive"] }
keepass = "0.17"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = "0.11"
sha2 = "0.11"
flate2 = "1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
