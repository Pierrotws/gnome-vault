[workspace]
members = [".", "crates/passel-core", "crates/passel-ffi"]

[package]
name = "passel"
version = "0.2.0"
edition = "2021"

[dependencies]
passel-core = { path = "crates/passel-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk-markdown = "0.2"
getrandom = "0.4.2"
once_cell = "1.21.4"
log = "0.4.29"
env_logger = "0.11.10"
zeroize = { version = "1.8", features = ["derive"] }
