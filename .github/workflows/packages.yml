name: Build packages

on:
  release:
    types: [published]
  # Manual trigger so packaging breakage can be caught without cutting a
  # release. Artifacts go to the run's artifact storage instead of a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-deb:
    name: Ubuntu .deb (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libgpgme-dev libgit2-dev libssh2-1-dev libssl-dev \
            cargo rustc \
            ruby ruby-dev \
            build-essential \
            python3-pip
          # Ubuntu 24.04 ships meson 1.3.2; project requires >= 1.4.
          sudo python3 -m pip install --break-system-packages --upgrade meson
          sudo gem install --no-document fpm

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
            VERSION="${BASE}+${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure and build (release)
        run: |
          # Use the checked-in .ui fallbacks so blueprint-compiler isn't
          # required at build time on the runner.
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Dblueprint=disabled
          meson compile -C build

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          install -Dm644 LICENSE \
            "staging/usr/share/licenses/gnome-vault/LICENSE"

      - name: Build .deb with fpm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          fpm \
            -s dir -t deb \
            -n gnome-vault \
            -v "$VERSION" \
            -a amd64 \
            --maintainer "Pierre Sauvage <m.sauvage.pierre@gmail.com>" \
            --description "GNOME Vault — pass-compatible password manager" \
            --license "GPL-3.0-or-later" \
            --url "https://github.com/Pierrotws/gnome-vault" \
            --depends "libgtk-4-1" \
            --depends "libadwaita-1-0" \
            --depends "libgpgme11t64" \
            --depends "libgit2-1.7" \
            --depends "gnupg" \
            --after-install packaging/debian/postinst.sh \
            --after-remove packaging/debian/postinst.sh \
            -C staging \
            usr

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gnome-vault-deb
          path: '*.deb'

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: '*.deb'

  arch-bin:
    # Built inside an Arch container so the binary links against the same
    # gpgme/gtk/libgit2 SONAMEs Arch users actually have. Building on
    # Ubuntu produced a tarball pinned to libgpgme.so.11 (gpgme 1.x) which
    # Arch (gpgme 2.x → libgpgme.so.45) cannot load.
    name: Arch binary tarball (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            rust meson ninja pkgconf \
            gtk4 libadwaita gpgme libgit2 libssh2 \
            git curl

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (container is root, host UID differs)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
            VERSION="${BASE}+${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure and build (release)
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Dblueprint=disabled
          meson compile -C build

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          install -Dm644 LICENSE \
            "staging/usr/share/licenses/gnome-vault/LICENSE"

      - name: Pack binary tarball (consumed by gnome-vault-bin AUR)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -C staging -czf "gnome-vault-$VERSION-x86_64.tar.gz" usr

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gnome-vault-arch-bin
          path: 'gnome-vault-*-x86_64.tar.gz'

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: 'gnome-vault-*-x86_64.tar.gz'
