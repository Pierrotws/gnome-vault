name: Build packages

on:
  release:
    types: [published]
  # Manual trigger so packaging breakage can be caught without cutting a
  # release: artifacts go to the run's artifact storage. Dispatched on a tag
  # (as release-please.yml does), the files are attached to that release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-deb:
    name: Ubuntu .deb (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # The archive can drop a package between `update` and its download
          # (a security update superseded: 404); refresh the index and retry.
          for attempt in 1 2 3; do
            sudo apt-get update &&
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                ninja-build pkg-config gettext \
                libgtk-4-dev libadwaita-1-dev \
                libgpgme-dev libgit2-dev libssh2-1-dev libssl-dev \
                cargo rustc \
                ruby ruby-dev \
                build-essential \
                python3-pip &&
              break
            if (( attempt == 3 )); then exit 1; fi
            echo "::warning::apt-get failed (attempt $attempt), retrying"
            sleep 30
          done
          # Ubuntu 24.04 ships meson 1.3.2; project requires >= 1.4.
          sudo python3 -m pip install --break-system-packages --upgrade meson
          sudo gem install --no-document fpm

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
            VERSION="${BASE}+${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure and build (release)
        run: |
          # Use the checked-in .ui fallbacks so blueprint-compiler isn't
          # required at build time on the runner.
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Dblueprint=disabled
          meson compile -C build

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          install -Dm644 LICENSE \
            "staging/usr/share/licenses/passel/LICENSE"

      - name: Build .deb with fpm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          fpm \
            -s dir -t deb \
            -n passel \
            -v "$VERSION" \
            -a amd64 \
            --maintainer "Pierre Sauvage <m.sauvage.pierre@gmail.com>" \
            --description "Passel — pass-compatible password manager for GNOME" \
            --license "GPL-3.0-or-later" \
            --url "https://github.com/Pierrotws/passel" \
            --depends "libgtk-4-1" \
            --depends "libadwaita-1-0" \
            --depends "libgpgme11t64" \
            --depends "libgit2-1.7" \
            --depends "gnupg" \
            --conflicts gnome-vault \
            --replaces gnome-vault \
            --after-install packaging/debian/postinst.sh \
            --after-remove packaging/debian/postinst.sh \
            -C staging \
            usr

      - name: Upload artifacts (untagged run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: passel-deb
          path: '*.deb'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.deb'

  arch-bin:
    # Built inside an Arch container so the binary links against the same
    # gpgme/gtk/libgit2 SONAMEs Arch users actually have. Building on
    # Ubuntu produced a tarball pinned to libgpgme.so.11 (gpgme 1.x) which
    # Arch (gpgme 2.x → libgpgme.so.45) cannot load.
    name: Arch binary tarball (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            rust meson ninja pkgconf gettext \
            gtk4 libadwaita gpgme libgit2 libssh2 \
            git curl

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (container is root, host UID differs)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
            VERSION="${BASE}+${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure and build (release)
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Dblueprint=disabled
          meson compile -C build

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          install -Dm644 LICENSE \
            "staging/usr/share/licenses/passel/LICENSE"

      - name: Pack binary tarball (consumed by passel-bin AUR)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -C staging -czf "passel-$VERSION-x86_64.tar.gz" usr

      - name: Upload artifacts (untagged run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: passel-arch-bin
          path: 'passel-*-x86_64.tar.gz'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'passel-*-x86_64.tar.gz'

  aur:
    # Replaces the old release.sh tail: bump both PKGBUILDs to the released
    # version, commit them to main, and publish them to the AUR.
    name: Publish PKGBUILDs to the AUR
    if: startsWith(github.ref, 'refs/tags/')
    # arch-bin attaches the tarball that passel-bin's checksum covers.
    needs: arch-bin
    # The AUR key is an environment secret; the `aur` environment only
    # accepts v* tags, so no branch or other workflow can read it.
    environment: aur
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare unprivileged makepkg user and git identity
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump PKGBUILDs and regenerate checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in passel passel-bin; do
            pkgbuild="packaging/arch/$pkg/PKGBUILD"
            sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" "$pkgbuild"
            work="/tmp/aur-work/$pkg"
            mkdir -p "$work"
            cp "$pkgbuild" "$work/PKGBUILD"
            chown -R builder: /tmp/aur-work
            (cd "$work" && sudo -u builder updpkgsums && sudo -u builder makepkg --printsrcinfo > .SRCINFO)
            cp "$work/PKGBUILD" "$pkgbuild"
          done
          git diff --stat

      - name: Commit PKGBUILDs to main
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git add packaging/arch/
          if git diff --cached --quiet; then
            echo "PKGBUILDs already at $VERSION."
          else
            git commit -m "build(packaging): bump PKGBUILDs to $VERSION"
            git push origin HEAD:main
          fi

      - name: Push to the AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set in the aur environment." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          install -dm700 /tmp/aur-ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /tmp/aur-ssh/id
          chmod 600 /tmp/aur-ssh/id
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /tmp/aur-ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i /tmp/aur-ssh/id -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/aur-ssh/known_hosts"
          for pkg in passel passel-bin; do
            aur_dir="/tmp/aur-repo/$pkg"
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$aur_dir"
            cp "/tmp/aur-work/$pkg/PKGBUILD" "/tmp/aur-work/$pkg/.SRCINFO" "$aur_dir/"
            git -C "$aur_dir" add PKGBUILD .SRCINFO
            if git -C "$aur_dir" diff --cached --quiet; then
              echo "$pkg already at $VERSION on the AUR."
            else
              git -C "$aur_dir" commit -m "Update to v$VERSION"
              git -C "$aur_dir" push origin master
            fi
          done

  google-play:
    # The Android app, signed with the upload key, to Google Play's
    # internal testing track (promote it to wider tracks by hand in Play
    # Console). One-time setup: android/README.md, "Publishing on Google
    # Play". Until its secrets exist, the job only says so.
    name: Android app to Google Play (internal testing)
    if: startsWith(github.ref, 'refs/tags/')
    # The upload key and the service account are environment secrets; the
    # `google-play` environment should only accept v* tags, like `aur`.
    environment: google-play
    runs-on: ubuntu-24.04
    env:
      CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.PLAY_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check the Play setup
        if: env.CONFIGURED != 'true'
        run: |
          echo "::notice title=Google Play::Not published: the google-play environment lacks its secrets (see android/README.md)."

      - name: Checkout
        if: env.CONFIGURED == 'true'
        uses: actions/checkout@v7

      - name: Release version matches the app's
        if: env.CONFIGURED == 'true'
        shell: bash
        run: |
          app=$(sed -n 's/^passel\.version=//p' android/gradle.properties)
          if [[ "$app" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::android/gradle.properties says $app, the release is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: JDK
        if: env.CONFIGURED == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Rust Android targets
        if: env.CONFIGURED == 'true'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo
        if: env.CONFIGURED == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: google-play
          workspaces: ". -> build/target"

      - name: Android platform
        if: env.CONFIGURED == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null

      - name: Build the signed app bundle
        if: env.CONFIGURED == 'true'
        working-directory: android
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PASSEL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PASSEL_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PASSEL_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          export PASSEL_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$PASSEL_UPLOAD_KEYSTORE"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon --console=plain \
            "-Ppassel.abis=arm64-v8a armeabi-v7a x86_64" bundleRelease
          rm -f "$PASSEL_UPLOAD_KEYSTORE"

      - name: Keep the bundle
        if: env.CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: passel-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: env.CONFIGURED == 'true'
        # Pinned to a commit: this action receives the service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.pierrotws.passel
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          status: completed
