<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {%- else %}
  <title>{{ site.title }} · Your passwords, in a vault you own</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#17306a">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/feature-graphic.png' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="32" height="32">
        <span>Passel</span>
      </a>
      <nav aria-label="Main">
        <a href="{{ '/#features' | relative_url }}">Features</a>
        <a href="{{ '/#screenshots' | relative_url }}">Screenshots</a>
        <a href="{{ '/#download' | relative_url }}">Download</a>
        <a class="nav-github" href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="24" height="24">
        <span>Passel — free software under the
          <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">GNU GPL v3</a>.</span>
      </div>
      <nav aria-label="Footer">
        <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
        <a href="https://github.com/{{ site.repository }}">Source code</a>
        <a href="https://github.com/{{ site.repository }}/issues">Report a problem</a>
        <a href="https://github.com/{{ site.repository }}/releases">Releases</a>
      </nav>
    </div>
  </footer>
</body>
</html>
