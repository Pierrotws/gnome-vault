[package]
name = "passel-core"
# Internal crate, never published: release-please only bumps the app's
# version, so this one stays fixed (a bumped one would leave Cargo.lock
# stale and break `--locked` builds).
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Passel's password-store logic, without any UI: entries, vaults, encryption, git sync and imports."
publish = false

[dependencies]
gpgme = { version = "0.11", optional = true }
getrandom = "0.4.2"
git2 = "0.20.4"
log = "0.4.29"
hmac = "0.12.1"
sha1 = "0.10.6"
data-encoding = "2.8.0"
zeroize = { version = "1.8", features = ["derive"] }
keepass = "0.17"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = "0.11"
sha2 = "0.11"
flate2 = "1"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1"
pgp = { version = "0.21.1", optional = true, default-features = false }
rand = { version = "0.8.6", optional = true }

# Where libgit2 uses OpenSSL (not Apple platforms): adding trusted
# certificates in memory, see git::trust_certificates. Same versions git2
# links, so no second copy is built.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
libgit2-sys = "0.18.3"
openssl-sys = "0.9.114"

[dev-dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }

[features]
default = ["gpgme"]
# OpenPGP through GnuPG (gpg-agent, pinentry, the user's keyring): the
# desktop backend.
gpgme = ["dep:gpgme"]
# Pure-Rust OpenPGP (rPGP) with an app-managed keyring: for platforms
# without GnuPG (Android, iOS). Installed with pgp::install_backend.
rpgp = ["dep:pgp", "dep:rand"]
# Build libgit2, OpenSSL and libssh2 from source instead of linking the
# system's: needed when cross-compiling for Android/iOS.
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl"]
