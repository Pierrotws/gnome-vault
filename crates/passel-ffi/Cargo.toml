[package]
name = "passel-ffi"
# Internal crate, never published (see passel-core/Cargo.toml).
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Passel's mobile API: passel-core with rPGP, exported to Kotlin and Swift through UniFFI."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

# Generates the Kotlin/Swift bindings from the built library:
#   cargo run -p passel-ffi --features bindgen --bin uniffi-bindgen -- \
#     generate --library <libpassel_ffi.so> --language kotlin --out-dir <dir>
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
passel-core = { path = "../passel-core", default-features = false, features = ["rpgp"] }
uniffi = "0.32.2"
log = "0.4.29"
zeroize = "1.8"
serde_json = "1"
tempfile = "3.27"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[features]
bindgen = ["uniffi/cli"]
# Build libgit2, OpenSSL and libssh2 from source (cross-compiling).
vendored = ["passel-core/vendored"]
